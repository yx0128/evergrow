name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Firefox 132, Safari 18
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
      description: Paste relevant console output or drag in images.
    validations:
      required: false
  - type: textarea
    id: save
    attributes:
      label: Save state (optional)
      description: Export your local save if the bug is world-specific. Remove personal task text.
    validations:
      required: false
