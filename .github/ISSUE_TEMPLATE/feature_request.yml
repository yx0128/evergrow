name: Feature request
description: Suggest a feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tasks
        - Focus
        - Economy / shop
        - World / placement
        - Tiles
        - Camera
        - Day / night
        - UI / accessibility
        - Assets
        - Docs
        - Other
    validations:
      required: true
